name: Deploy Worker

# Deploys assistant/worker.js to Cloudflare Workers and injects its runtime
# secrets straight from this repo's secret store. Nothing passes through
# chat or logs.
# Requires repo secrets: CLOUDFLARE_API_TOKEN, SLACK_SIGNING_SECRET, plus
# the existing SLACK_BOT_TOKEN, FIREWORKS_API_KEY, ANTHROPIC_API_KEY.
# Optional: GH_DISPATCH_TOKEN for instant apply: dispatch from the worker
# (GH_STATE_TOKEN works if it has actions read and write; otherwise the
# 5-minute poller handles apply: messages).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: python deploy/worker_deploy.py
