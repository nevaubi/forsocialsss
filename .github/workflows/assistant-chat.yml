name: Assistant Chat

# Kimi K3 assistant poller. Structurally read-only: contents: read means it
# cannot push anything; actions: write only lets it dispatch the apply
# workflow when Firas sends an explicit "apply:" message.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: assistant-chat
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll and reply
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_STATE_TOKEN: ${{ secrets.GH_STATE_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python assistant/assistant.py chat
