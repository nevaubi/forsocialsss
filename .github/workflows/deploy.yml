name: Deploy Agent

# Provisions and operates the Claude Managed Agents deployment.
# Secrets this workflow expects (Settings > Secrets and variables > Actions):
#   ANTHROPIC_API_KEY   required
#   APIFY_API_KEY       LinkedIn and X scraping
#   TAVILY_API_KEY      research and verification layer
#   FIREWORKS_API_KEY   optional auxiliary models
#   SLACK_BOT_TOKEN     draft delivery and inbox (see README for app setup)
#   GH_STATE_TOKEN      fine-grained PAT, contents read/write on this repo,
#                       lets the agent push state commits between runs
# Missing optional secrets degrade gracefully; deploy.py prints what each
# absence disables.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        default: provision
        options:
          - provision
          - run
          - status
          - pause
          - unpause
      recreate:
        description: Rebuild agent, environment, and deployment from current repo files
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deploy.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_STATE_TOKEN: ${{ secrets.GH_STATE_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.recreate }}" = "true" ]; then FLAGS="--recreate"; fi
          python deploy/deploy.py "${{ inputs.action }}" $FLAGS
