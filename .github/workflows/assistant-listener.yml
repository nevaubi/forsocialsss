name: Assistant Listener

# Live Socket Mode listener for instant replies. Each run serves a bounded
# window then re-dispatches itself; the hourly cron self-heals a dead chain,
# and a startup guard ensures only one listener is ever live. The 5-minute
# poller covers the brief gap between windows.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Singleton guard
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/assistant-listener.yml/runs?status=in_progress&per_page=10" \
            | python3 -c "import json,sys; rs=json.load(sys.stdin)['workflow_runs']; print(sum(1 for r in rs if r['id'] != ${{ github.run_id }}))")
          echo "others=$COUNT" >> "$GITHUB_OUTPUT"
          echo "other in-progress listeners: $COUNT"
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.others == '0'
        with:
          python-version: "3.12"
      - name: Install slack_sdk
        if: steps.guard.outputs.others == '0'
        run: pip install --quiet slack_sdk
      - name: Listen
        if: steps.guard.outputs.others == '0'
        env:
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GH_STATE_TOKEN: ${{ secrets.GH_STATE_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LISTENER_MINUTES: "340"
        run: python assistant/listener.py
      - name: Re-dispatch
        if: always() && steps.guard.outputs.others == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -o /dev/null -w "re-dispatch HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/assistant-listener.yml/dispatches" \
            -d '{"ref":"main"}'
